apiVersion: apps/v1
kind: Deployment
metadata:
  name: software-factory
  namespace: {{ .Values.tenant.namespace }}
  labels:
{{ include "software-factory.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.factory.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: software-factory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: software-factory
        softwarefactory.io/tenant: {{ .Values.tenant.name | quote }}
        softwarefactory.io/environment: {{ .Values.tenant.environment | quote }}
    spec:
      serviceAccountName: software-factory
      containers:
        - name: controller
          image: "{{ .Values.factory.image.repository }}:{{ .Values.factory.image.tag }}"
          imagePullPolicy: {{ .Values.factory.image.pullPolicy }}
          env:
            - name: TENANT_NAME
              value: {{ .Values.tenant.name | quote }}
            - name: ENVIRONMENT_NAME
              value: {{ .Values.tenant.environment | quote }}
            - name: GITOPS_REPOSITORY
              value: {{ .Values.gitops.repository | quote }}
          resources:
{{ toYaml .Values.factory.resources | indent 12 }}
