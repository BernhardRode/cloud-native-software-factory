{{- if .Values.sampleApp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: {{ .Values.tenant.namespace }}
  labels:
    app.kubernetes.io/name: sample-app
{{ include "software-factory.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app
    spec:
      containers:
        - name: http
          image: {{ .Values.sampleApp.image | quote }}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: {{ .Values.tenant.namespace }}
spec:
  selector:
    app.kubernetes.io/name: sample-app
  ports:
    - name: http
      port: 80
      targetPort: 80
{{- end }}
