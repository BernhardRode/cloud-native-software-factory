{{- if and .Values.identity.enabled .Values.identity.pocketId.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocket-id
  namespace: {{ .Values.tenant.namespace }}
  labels:
{{ include "software-factory.componentLabels" (dict "ctx" $ "name" "pocket-id") | indent 4 }}
  {{- with .Values.identity.pocketId.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- with .Values.identity.pocketId.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.identity.pocketId.ingress.tls }}
  tls:
{{ toYaml . | indent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.identity.pocketId.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pocket-id
                port:
                  number: {{ .Values.identity.pocketId.service.port }}
{{- end }}
