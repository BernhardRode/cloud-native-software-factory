{{- if and .Values.identity.enabled (not .Values.identity.pocketId.existingSecret) }}
{{- if lt (len .Values.identity.pocketId.encryptionKey) 16 }}
{{- fail "identity.pocketId.encryptionKey must be at least 16 characters" }}
{{- end }}
{{- if lt (len .Values.identity.pocketId.staticApiKey) 16 }}
{{- fail "identity.pocketId.staticApiKey must be at least 16 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: pocket-id
  namespace: {{ .Values.tenant.namespace }}
  labels:
{{ include "software-factory.componentLabels" (dict "ctx" $ "name" "pocket-id") | indent 4 }}
type: Opaque
stringData:
  encryption-key: {{ .Values.identity.pocketId.encryptionKey | quote }}
  static-api-key: {{ .Values.identity.pocketId.staticApiKey | quote }}
{{- end }}
