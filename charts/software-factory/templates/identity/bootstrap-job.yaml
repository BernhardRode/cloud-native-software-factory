{{- if and .Values.identity.enabled .Values.identity.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: pocket-id-bootstrap
  namespace: {{ .Values.tenant.namespace }}
  labels:
{{ include "software-factory.componentLabels" (dict "ctx" $ "name" "pocket-id-bootstrap") | indent 4 }}
  annotations:
    # Runs after Pocket ID and its configuration exist, on install and on every upgrade.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.identity.bootstrap.backoffLimit }}
  template:
    metadata:
      labels:
{{ include "software-factory.componentLabels" (dict "ctx" $ "name" "pocket-id-bootstrap") | indent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: bootstrap
          image: "{{ .Values.identity.bootstrap.image.repository }}:{{ .Values.identity.bootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.identity.bootstrap.image.pullPolicy }}
          command: ["python3", "/scripts/bootstrap.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: POCKET_ID_URL
              value: {{ include "software-factory.pocketIdInternalUrl" . | quote }}
            - name: POCKET_ID_APP_URL
              value: {{ .Values.identity.pocketId.appUrl | quote }}
            - name: BOOTSTRAP_CONFIG
              value: /config/bootstrap.json
            - name: POCKET_ID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "software-factory.pocketIdSecretName" . }}
                  key: static-api-key
          {{- if .Values.groupExplorer.enabled }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "software-factory.groupExplorerSecretName" . }}
                  key: client-secret
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
{{ toYaml .Values.identity.bootstrap.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: pocket-id-bootstrap
            items:
              - key: bootstrap.json
                path: bootstrap.json
        - name: scripts
          configMap:
            name: pocket-id-bootstrap
            items:
              - key: bootstrap.py
                path: bootstrap.py
{{- end }}
