apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-native-software-factory-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/cloud-native-software-factory.git
    targetRevision: HEAD
    path: gitops/clusters/local
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
