apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: software-factory-control-plane
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/cloud-native-software-factory.git
    targetRevision: HEAD
    path: packages/software-factory-control-plane
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
